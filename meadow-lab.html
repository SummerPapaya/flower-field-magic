<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>花田密度实验</title>
    <style>
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8d8; color: #fff; overscroll-behavior: none;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; -webkit-text-size-adjust: 100%; }
      video, canvas { position: fixed; inset: 0; display: block; }
      video { width: 100%; height: 100%; object-fit: cover; }
      /* three.js 和 8th Wall 都会改画布的 CSS 尺寸，这里强制铺满屏幕。 */
      canvas { width: 100vw !important; height: 100vh !important; height: 100dvh !important; touch-action: none; }
      .panel { position: fixed; left: 8px; right: 8px; z-index: 5; pointer-events: none; }
      .panel > * { pointer-events: auto; }
      #hud { top: max(8px, env(safe-area-inset-top)); font-variant-numeric: tabular-nums; }
      #hud div { display: inline-block; padding: 6px 10px; border-radius: 10px; background: rgba(16, 22, 38, 0.62); pointer-events: none; }
      #bar { bottom: max(8px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
      .row { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; padding: 3px; border-radius: 999px; background: rgba(16, 22, 38, 0.62); }
      .row span { padding: 0 6px 0 8px; opacity: 0.8; }
      button { border: 0; border-radius: 999px; padding: 6px 10px; font: inherit; color: #fff; background: transparent; }
      button.on { color: #1f2a44; background: #fff; }
      a { color: #fff; }
      #start { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
        padding: 24px; text-align: center; background: #1b2438; }
      #start button { padding: 12px 26px; font-size: 16px; color: #fff; background: #3d59b8; }
      #start button:disabled { opacity: 0.5; }
      .legal { font-size: 10px; opacity: 0.75; }
      #qr { position: fixed; right: 12px; top: 12px; z-index: 8; width: 210px; padding: 12px; border-radius: 14px; background: #fff; color: #1f2a44;
        display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25); }
      #qr svg { width: 186px; height: 186px; }
      #qr small { color: #5b6785; }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted autoplay hidden></video>
    <canvas id="c"></canvas>
    <div id="start" hidden>
      <p id="start-text">点按开始后会请求相机和陀螺仪权限。</p>
      <button id="btn-start">开始</button>
      <p id="start-err"></p>
    </div>
    <div class="panel" id="hud"><div id="stats">…</div></div>
    <div class="panel" id="bar"></div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
